<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>docuqa — 文档问答</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #e2e5ea;
      --text: #1f2329;
      --muted: #6b7280;
      --accent: #3b6ef5;
      --accent-hover: #2f5ad0;
      --ok: #16a34a;
      --err: #dc2626;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .lang-toggle {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .lang-toggle:hover { border-color: var(--accent); color: var(--accent); }
    main { max-width: 880px; margin: 0 auto; padding: 24px 24px 72px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 20px;
    }
    .card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 650; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field-row { display: flex; gap: 10px; }
    .field-row > input { flex: 1; }
    input[type="text"] {
      width: 100%;
      background: #fbfbfd;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 110, 245, 0.15); }
    button.primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .status { font-size: 13px; margin-top: 10px; min-height: 18px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .status.info { color: var(--muted); }
    .muted { color: var(--muted); font-size: 13px; }
    .spinner {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .spinner::before {
      content: "";
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .answer-label { font-size: 13px; color: var(--muted); margin-top: 18px; }
    .answer {
      background: #fbfbfd;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      margin-top: 6px;
    }
    .sources-label { font-size: 13px; color: var(--muted); margin-top: 16px; }
    .sources { list-style: none; padding: 0; margin: 8px 0 0; }
    .sources li { border-top: 1px solid var(--border); padding: 10px 0; font-size: 13px; }
    .sources .meta { color: var(--muted); margin-bottom: 4px; }
    .sources .score { color: var(--accent); font-weight: 600; }
    .sources .text { color: var(--text); opacity: 0.82; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .stat { background: #fbfbfd; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat .v { font-size: 15px; font-weight: 650; margin-top: 3px; word-break: break-all; }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 26px 20px;
      text-align: center;
      color: var(--muted);
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }
    .drop-zone.dragover { border-color: var(--accent); background: rgba(59, 110, 245, 0.05); }
    .drop-main { margin: 0; font-size: 15px; font-weight: 600; color: var(--text); }
    .drop-hint { margin: 4px 0 12px; font-size: 13px; }
    button.secondary {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary:hover { border-color: var(--accent); color: var(--accent); }
    .file-list { margin-top: 12px; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fbfbfd;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .size { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .remove-file { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
    .remove-file:hover { color: var(--err); }
    .upload-row { margin-top: 12px; }
    .divider { border-top: 1px solid var(--border); margin: 20px 0; }
    .sub-heading { font-size: 14px; font-weight: 650; margin: 0 0 10px; }
    @media (max-width: 560px) {
      .field-row { flex-direction: column; }
      .header-inner { padding: 12px 16px; }
      main { padding: 16px 16px 56px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <h1>docuqa</h1>
        <p id="subtitle"></p>
      </div>
      <button id="lang-toggle" class="lang-toggle" type="button"></button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 data-i18n="indexHeading"></h2>

      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" multiple hidden />
        <p class="drop-main" data-i18n="dropMain"></p>
        <p class="drop-hint" data-i18n="dropHint"></p>
        <button class="secondary" id="browse-btn" type="button" data-i18n="browseBtn"></button>
      </div>
      <div class="file-list" id="file-list"></div>
      <div class="upload-row">
        <button class="primary" id="upload-btn" type="button" data-i18n="uploadBtn" disabled></button>
      </div>
      <div class="spinner" id="upload-spinner" data-i18n="uploading"></div>
      <div class="status" id="upload-status"></div>

      <div class="divider"></div>
      <h3 class="sub-heading" data-i18n="pathHeading"></h3>
      <label data-i18n="indexLabel" for="ingest-path"></label>
      <div class="field-row">
        <input type="text" id="ingest-path" data-i18n-placeholder="indexPlaceholder" />
        <button class="primary" id="ingest-btn" type="button" data-i18n="indexBtn"></button>
      </div>
      <div class="spinner" id="ingest-spinner" data-i18n="indexing"></div>
      <div class="status" id="ingest-status"></div>
    </section>

    <section class="card">
      <h2 data-i18n="askHeading"></h2>
      <label data-i18n="questionLabel" for="question"></label>
      <div class="field-row">
        <input type="text" id="question" data-i18n-placeholder="questionPlaceholder" />
        <button class="primary" id="ask-btn" type="button" data-i18n="askBtn"></button>
      </div>
      <div class="spinner" id="ask-spinner" data-i18n="generating"></div>
      <div class="status" id="ask-status"></div>
      <div id="answer-area" hidden>
        <div class="answer-label" data-i18n="answerLabel"></div>
        <div class="answer" id="answer-text"></div>
        <div class="sources-label" data-i18n="sourcesLabel"></div>
        <ul class="sources" id="sources"></ul>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="statsHeading"></h2>
      <div id="stats" class="stats-grid"></div>
    </section>
  </main>

  <script>
    const I18N = {
      zh: {
        subtitle: "检索增强生成 · 文档问答",
        langToggle: "English",
        indexHeading: "索引",
        indexLabel: "要索引的文件或目录",
        indexPlaceholder: "例如 examples 或 C:\\path\\to\\docs",
        indexBtn: "索引",
        dropMain: "拖拽文件到这里",
        dropHint: "或点击选择文件（支持多选：PDF / Markdown / 文本）",
        browseBtn: "选择文件",
        uploadBtn: "上传并索引",
        uploading: "正在上传并索引…",
        uploaded: (p) => `已上传并索引 ${p.documents} 个文件`,
        uploadError: "上传失败：",
        pathHeading: "或按服务器路径索引（适合整个目录）",
        askHeading: "提问",
        questionLabel: "问题",
        questionPlaceholder: "针对你的文档提问…",
        askBtn: "提问",
        answerLabel: "答案",
        sourcesLabel: "引用来源",
        statsHeading: "索引统计",
        indexing: "正在索引…",
        generating: "正在生成答案…",
        statsLoading: "加载中…",
        indexed: (p) => {
          const replaced = p.replaced ? `，${p.replaced} 个已更新` : "";
          const rebuilt = p.rebuilt ? "（嵌入模型已变更，索引已重建）" : "";
          return `已索引 ${p.chunks} 个分块，来自 ${p.documents} 个文档${replaced}${rebuilt}`;
        },
        ingestError: "索引失败：",
        askError: "提问失败：",
        noIndex: "还没有索引，请先在上方输入路径并点击「索引」。",
        emptyStats: "暂无索引数据",
        statLabels: {
          index_dir: "索引目录",
          chunks: "分块数",
          chunk_size: "分块大小",
          chunk_overlap: "分块重叠",
          top_k: "检索数量 (Top-k)",
          embedder: "嵌入后端",
          llm: "生成后端",
        },
        backends: { local: "本地", hashing: "哈希（演示）", mock: "模拟（演示）" },
      },
      en: {
        subtitle: "Retrieval-Augmented Generation document Q&A",
        langToggle: "中文",
        indexHeading: "Index",
        indexLabel: "File or directory to index",
        indexPlaceholder: "e.g. examples or /path/to/docs",
        indexBtn: "Index",
        dropMain: "Drop files here",
        dropHint: "or click to browse (multiple: PDF / Markdown / text)",
        browseBtn: "Choose files",
        uploadBtn: "Upload & index",
        uploading: "Uploading & indexing…",
        uploaded: (p) => `Uploaded & indexed ${p.documents} file(s)`,
        uploadError: "Upload failed: ",
        pathHeading: "Or index a server path (for whole directories)",
        askHeading: "Ask",
        questionLabel: "Question",
        questionPlaceholder: "Ask a question about your documents…",
        askBtn: "Ask",
        answerLabel: "Answer",
        sourcesLabel: "Sources",
        statsHeading: "Index stats",
        indexing: "Indexing…",
        generating: "Generating answer…",
        statsLoading: "Loading…",
        indexed: (p) => {
          const replaced = p.replaced ? `, ${p.replaced} replaced` : "";
          const rebuilt = p.rebuilt ? " (embedding model changed; index rebuilt)" : "";
          return `Indexed ${p.chunks} chunks from ${p.documents} document(s)${replaced}${rebuilt}`;
        },
        ingestError: "Index failed: ",
        askError: "Ask failed: ",
        noIndex: "No index yet. Index some documents first, then ask.",
        emptyStats: "No index data",
        statLabels: {
          index_dir: "Index dir",
          chunks: "Chunks",
          chunk_size: "Chunk size",
          chunk_overlap: "Chunk overlap",
          top_k: "Top-k",
          embedder: "Embedder",
          llm: "LLM",
        },
        backends: {},
      },
    };

    const $ = (id) => document.getElementById(id);
    let lang = "zh";
    let chunkCount = 0;

    function detectLang() {
      const saved = localStorage.getItem("docuqa.lang");
      if (saved === "zh" || saved === "en") return saved;
      return (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
    }

    function t(key) {
      return I18N[lang][key];
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function backendLabel(value) {
      const zh = I18N.zh.backends[value];
      return lang === "zh" && zh ? zh : value;
    }

    function applyLanguage() {
      document.documentElement.lang = lang;
      document.title = "docuqa — " + (lang === "zh" ? "文档问答" : "Document Q&A");
      $("subtitle").textContent = t("subtitle");
      $("lang-toggle").textContent = t("langToggle");
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
      });
      $("ingest-spinner").textContent = t("indexing");
      $("ask-spinner").textContent = t("generating");
      renderStats();
    }

    async function api(path, body) {
      const options = body
        ? {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          }
        : {};
      const res = await fetch(path, options);
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `HTTP ${res.status}`);
      }
      return res.json();
    }

    function setStatus(el, cls, text) {
      el.className = "status " + cls;
      el.textContent = text;
    }

    async function refreshStats() {
      try {
        const stats = await api("/api/stats");
        window._stats = stats;
        chunkCount = stats.chunks || 0;
        renderStats();
      } catch (e) {
        $("stats").innerHTML = `<div class="muted">${escapeHtml(t("emptyStats"))}</div>`;
      }
    }

    function renderStats() {
      const stats = window._stats;
      if (!stats) {
        $("stats").innerHTML = `<div class="muted">${escapeHtml(t("statsLoading"))}</div>`;
        return;
      }
      const labels = t("statLabels");
      $("stats").innerHTML = Object.entries(stats)
        .map(([k, v]) => {
          const label = labels[k] || k;
          const value = ["embedder", "llm"].includes(k) ? backendLabel(v) : v;
          return `<div class="stat"><div class="k">${escapeHtml(label)}</div><div class="v">${escapeHtml(value)}</div></div>`;
        })
        .join("");
    }

    function setBusy(button, spinner, busy) {
      button.disabled = busy;
      spinner.style.display = busy ? "flex" : "none";
    }

    $("ingest-btn").addEventListener("click", async () => {
      const path = $("ingest-path").value.trim();
      if (!path) {
        setStatus($("ingest-status"), "err", t("ingestError") + " " + t("indexLabel"));
        return;
      }
      setBusy($("ingest-btn"), $("ingest-spinner"), true);
      setStatus($("ingest-status"), "info", t("indexing"));
      try {
        const result = await api("/api/ingest", { path });
        setStatus($("ingest-status"), "ok", t("indexed")(result));
        await refreshStats();
      } catch (e) {
        setStatus($("ingest-status"), "err", t("ingestError") + " " + e.message);
      } finally {
        setBusy($("ingest-btn"), $("ingest-spinner"), false);
      }
    });

    let selectedFiles = [];

    function addFiles(files) {
      for (const file of files) selectedFiles.push(file);
      renderFileList();
    }

    function renderFileList() {
      $("file-list").innerHTML = selectedFiles
        .map((file, i) => {
          const size = file.size > 1024 * 1024
            ? (file.size / 1024 / 1024).toFixed(1) + " MB"
            : (file.size / 1024).toFixed(1) + " KB";
          return `<div class="file-item"><span class="name">${escapeHtml(file.name)}</span><span class="size">${size}</span><button class="remove-file" type="button" data-i="${i}">×</button></div>`;
        })
        .join("");
      $("upload-btn").disabled = selectedFiles.length === 0;
      document.querySelectorAll(".remove-file").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedFiles.splice(Number(btn.dataset.i), 1);
          renderFileList();
        });
      });
    }

    $("browse-btn").addEventListener("click", () => $("file-input").click());
    $("file-input").addEventListener("change", (e) => {
      addFiles([...e.target.files]);
    });

    const dropZone = $("drop-zone");
    ["dragenter", "dragover"].forEach((type) => {
      dropZone.addEventListener(type, (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach((type) => {
      dropZone.addEventListener(type, (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
      });
    });
    dropZone.addEventListener("drop", (e) => {
      addFiles([...e.dataTransfer.files]);
    });

    $("upload-btn").addEventListener("click", async () => {
      if (!selectedFiles.length) return;
      const formData = new FormData();
      selectedFiles.forEach((file) => formData.append("files", file));
      setBusy($("upload-btn"), $("upload-spinner"), true);
      setStatus($("upload-status"), "info", t("uploading"));
      try {
        const res = await fetch("/api/upload", { method: "POST", body: formData });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || `HTTP ${res.status}`);
        }
        const result = await res.json();
        setStatus($("upload-status"), "ok", t("uploaded")(result));
        selectedFiles = [];
        renderFileList();
        $("file-input").value = "";
        await refreshStats();
      } catch (e) {
        setStatus($("upload-status"), "err", t("uploadError") + " " + e.message);
      } finally {
        setBusy($("upload-btn"), $("upload-spinner"), false);
      }
    });

    async function ask() {
      const question = $("question").value.trim();
      if (!question) return;
      if (chunkCount === 0) {
        setStatus($("ask-status"), "info", t("noIndex"));
        return;
      }
      setBusy($("ask-btn"), $("ask-spinner"), true);
      setStatus($("ask-status"), "info", "");
      try {
        const result = await api("/api/ask", { question });
        $("answer-text").textContent = result.answer || "";
        $("sources").innerHTML = (result.sources || [])
          .map((s, i) => {
            const score = typeof s.score === "number" ? s.score.toFixed(3) : s.score;
            return `<li><div class="meta">[${i + 1}] <span class="score">${escapeHtml(score)}</span> — ${escapeHtml(s.source)}</div><div class="text">${escapeHtml((s.text || "").slice(0, 300))}</div></li>`;
          })
          .join("");
        $("answer-area").hidden = false;
        setStatus($("ask-status"), "ok", "");
      } catch (e) {
        setStatus($("ask-status"), "err", t("askError") + " " + e.message);
      } finally {
        setBusy($("ask-btn"), $("ask-spinner"), false);
      }
    }

    $("ask-btn").addEventListener("click", ask);
    $("question").addEventListener("keydown", (e) => {
      if (e.key === "Enter") ask();
    });

    $("lang-toggle").addEventListener("click", () => {
      lang = lang === "zh" ? "en" : "zh";
      localStorage.setItem("docuqa.lang", lang);
      applyLanguage();
    });

    lang = detectLang();
    applyLanguage();
    refreshStats();
  </script>
</body>
</html>
